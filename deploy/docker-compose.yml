services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fastrobox
      POSTGRES_DB: fastrobox
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in deploy/.env}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fastrobox"]
      interval: 5s
      retries: 10

  api:
    build: ../server
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://fastrobox:${POSTGRES_PASSWORD}@postgres:5432/fastrobox
    depends_on:
      postgres: { condition: service_healthy }

  worker:
    build: ../server
    command: python -m app.worker
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://fastrobox:${POSTGRES_PASSWORD}@postgres:5432/fastrobox
    depends_on:
      postgres: { condition: service_healthy }

  test-postgres:
    image: postgres:16-alpine
    profiles: [test]
    environment:
      POSTGRES_USER: fastrobox
      POSTGRES_DB: fastrobox_test
      POSTGRES_HOST_AUTH_METHOD: trust
    ports: ["54329:5432"]

  simulator:
    build: ../simulator
    profiles: [sim]
    environment:
      DEVICE_TOKEN: ${DEVICE_TOKEN:?run server/seed.py or dev_seed.py first}
      DEVICE_ID: T17-D1
      ROOM_ID: R-305
    command: >
      python simulate.py --base http://web
      --scenario ${SIM_SCENARIO:-normal} --count 6 --interval 5
    depends_on: [web]

  web:
    build:
      context: ..
      dockerfile: web/Dockerfile
    ports: ["80:80"]
    depends_on: [api]

volumes:
  pgdata:
